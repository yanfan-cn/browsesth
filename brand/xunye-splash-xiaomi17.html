<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>巡页 · 开屏示意（小米 17）</title>
<style>
  :root {
    --beige: #F6F1EA;
    --navy: #1B2A4A;
    --muted: #8A8680;
    --frame: #1a1a1c;
    --frame-shine: #3a3a40;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: radial-gradient(1200px 800px at 50% 20%, #2a2d35, #0e0f12 70%);
    font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    color: #eee;
    padding: 24px 16px 40px;
  }
  h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.04em; color: #c8c8cc; }
  .hint { font-size: 13px; color: #9a9aa0; }
  .stage { perspective: 1200px; }

  /* Xiaomi 17-ish: 6.3" ~1220×2656 ≈ 19.6:9, flat sides, centered punch-hole */
  .phone {
    width: min(360px, 86vw);
    aspect-ratio: 1220 / 2656;
    background: linear-gradient(160deg, #2c2c30 0%, var(--frame) 40%, #111114 100%);
    border-radius: 42px;
    padding: 10px;
    box-shadow:
      0 0 0 1px #000,
      0 0 0 2px #4a4a50,
      0 28px 60px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.12);
    position: relative;
  }
  .phone::before {
    /* side buttons hint */
    content: "";
    position: absolute;
    right: -3px; top: 18%;
    width: 3px; height: 52px;
    background: #2a2a2e;
    border-radius: 2px;
  }
  .phone::after {
    content: "";
    position: absolute;
    left: -3px; top: 22%;
    width: 3px; height: 28px;
    background: #2a2a2e;
    border-radius: 2px;
  }
  .screen {
    width: 100%;
    height: 100%;
    border-radius: 34px;
    overflow: hidden;
    background: var(--beige);
    position: relative;
    isolation: isolate;
  }
  /* Punch-hole */
  .camera {
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #0a0a0c;
    box-shadow: inset 0 0 0 2px #1c1c22, 0 0 0 1px rgba(255,255,255,.08);
    z-index: 5;
  }
  .camera i {
    display: block; width: 5px; height: 5px; border-radius: 50%;
    background: #142038; margin: 4.5px auto 0;
    box-shadow: inset 0 0 2px #3a6ab0;
  }
  .status {
    position: absolute; top: 10px; left: 18px; right: 18px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; font-weight: 600; color: var(--navy); opacity: 0;
    z-index: 4; letter-spacing: 0.02em;
  }
  .status.show { animation: fadeIn 0.4s ease 2.6s forwards; }

  .splash {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--beige);
    z-index: 3;
  }
  .logo-wrap {
    width: 112px; height: 112px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(27,42,74,.18);
    opacity: 0;
    transform: scale(0.86) translateY(10px);
  }
  .logo-wrap img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .brand {
    margin-top: 18px;
    font-size: 28px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.12em;
    opacity: 0;
    transform: translateY(8px);
  }
  .sub {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    opacity: 0;
  }

  /* animation timeline */
  .play .logo-wrap {
    animation: popIn 0.7s cubic-bezier(.2,.8,.2,1) 0.25s forwards;
  }
  .play .brand {
    animation: fadeUp 0.55s ease 0.7s forwards;
  }
  .play .sub {
    animation: fadeUp 0.55s ease 0.95s forwards;
  }
  .play .splash {
    animation: splashOut 0.55s ease 2.4s forwards;
  }
  .play .home {
    animation: homeIn 0.55s ease 2.45s forwards;
  }

  @keyframes popIn {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes splashOut {
    to { opacity: 0; visibility: hidden; transform: scale(1.02); }
  }
  @keyframes homeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .home {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #F6F1EA 0%, #EFE8DE 100%);
    opacity: 0;
    z-index: 2;
    padding: 56px 20px 28px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .omnibox {
    height: 40px; border-radius: 20px;
    background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.06);
    display: flex; align-items: center; padding: 0 14px;
    color: #9a9590; font-size: 13px;
  }
  .tiles {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 8px;
    margin-top: 8px;
  }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 11px; color: var(--navy);
  }
  .tile span {
    width: 44px; height: 44px; border-radius: 12px;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .label { font-size: 12px; color: var(--muted); margin-top: auto; text-align: center; }

  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  button {
    border: 0; border-radius: 999px;
    padding: 10px 18px;
    background: #e8e4dc; color: #1b1b1f;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button.primary { background: #c9a227; color: #1a1408; }
  button:active { transform: scale(0.98); }
  .meta { font-size: 12px; color: #7a7a82; text-align: center; max-width: 360px; line-height: 1.5; }
</style>
</head>
